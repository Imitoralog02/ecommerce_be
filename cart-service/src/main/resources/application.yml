spring:
  application:
    name: cart-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${PORT:8083}
services:
  catalog-url: ${CATALOG_URL:http://localhost:8082}
app:
  internal-api-key: ${INTERNAL_API_KEY:change-this-development-internal-key-32-chars}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-32-chars}
    ttl: ${JWT_TTL:PT30M}
  cart:
    ttl: ${CART_TTL:P30D}
management:
  endpoints:
    web:
      exposure:
        include: health,info
