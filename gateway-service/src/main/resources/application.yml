spring:
  application:
    name: gateway-service
server:
  port: ${PORT:8080}
services:
  auth: ${AUTH_URL:http://localhost:8081}
  catalog: ${CATALOG_URL:http://localhost:8082}
  cart: ${CART_URL:http://localhost:8083}
  order: ${ORDER_URL:http://localhost:8084}
  notification: ${NOTIFICATION_URL:http://localhost:8085}
  customer: ${CUSTOMER_URL:http://localhost:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,info
