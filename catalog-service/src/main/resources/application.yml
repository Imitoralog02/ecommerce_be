spring:
  application:
    name: catalog-service
  mongodb:
    uri: ${CATALOG_MONGODB_URI:mongodb://localhost:27017/ecommerce_catalog}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  flash-sale:
    seed-demo: ${FLASH_SALE_DEMO_SEED:true}
  catalog:
    sync-legacy-demo: ${CATALOG_SYNC_LEGACY_DEMO:false}
  internal-api-key: ${INTERNAL_API_KEY:change-this-development-internal-key-32-chars}
  inventory:
    demo-seed-quantity: ${INVENTORY_DEMO_SEED_QUANTITY:20}
server:
  port: ${PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
