spring:
  application:
    name: customer-service
  mongodb:
    uri: ${CUSTOMER_MONGODB_URI:mongodb://localhost:27017/ecommerce_customer}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${PORT:8086}

services:
  catalog-url: ${CATALOG_URL:http://localhost:8082}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-32-chars}
    ttl: ${JWT_TTL:PT30M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
