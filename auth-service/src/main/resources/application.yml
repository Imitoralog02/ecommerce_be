spring:
  application:
    name: auth-service
  mongodb:
    uri: ${AUTH_MONGODB_URI:mongodb://localhost:27017/ecommerce_auth}
  data:
    mongodb:
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${PORT:8081}

app:
  auth:
    refresh-ttl: ${AUTH_REFRESH_TTL:P30D}
    reset-ttl: ${AUTH_RESET_TTL:PT10M}
    reset-cooldown: ${AUTH_RESET_COOLDOWN:PT1M}
    reset-from: ${AUTH_RESET_FROM:noreply@neora.local}
    reset-secret: ${PASSWORD_RESET_SECRET:${JWT_SECRET:change-this-development-secret-32-chars}}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-32-chars}
    ttl: ${JWT_TTL:PT30M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
